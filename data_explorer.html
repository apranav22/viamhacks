<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Collection explorer · Spot it, sort it</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0a0f1e;color:#e6ecff;font:14px/1.5 system-ui,sans-serif}header{padding:22px 28px;border-bottom:1px solid #29334b;background:#111a30}h1{font-size:25px;margin:0}h2{font-size:18px}p{margin:6px 0;color:#9baac6}a{color:#71c8ff}button,select,input{background:#14213a;border:1px solid #364563;color:#e6ecff;padding:9px 12px;border-radius:8px;font:inherit}button{cursor:pointer}button:hover{border-color:#38bdf8}main{padding:22px 28px}.activity,.tools,.counts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.activity{margin:16px 0}.state{padding:9px 14px;border:1px solid #334155;border-radius:9px;color:#a6b6cf}.state.on{background:#123b32;color:#72e7b2;border-color:#26775a}.state.unknown{color:#fbbf24}.counts{margin:18px 0;color:#a9bad4}.counts strong{color:white}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:20px 0}label{font-size:12px;color:#a9bad4}label select,label input{display:block;width:100%;margin-top:5px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}.card{background:#111a30;border:1px solid #29334b;border-radius:12px;overflow:hidden;cursor:pointer}.card.selected{border:2px solid #38bdf8}.card img{width:100%;height:190px;object-fit:contain;background:#070b14}.caption{padding:12px}.caption b{display:block}.tag{display:inline-block;color:#b8c9e5;background:#1b2941;border-radius:5px;padding:2px 6px;font-size:11px;margin:6px 4px 0 0}.empty{padding:40px;border:1px dashed #334155;color:#a9bad4}dialog{width:min(1200px,95vw);max-height:93vh;background:#111a30;color:#e6ecff;border:1px solid #475569;border-radius:14px;padding:22px}dialog::backdrop{background:#000b}.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}.detail-grid img{width:100%;max-height:65vh;object-fit:contain;background:#060a15}.siblings{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.siblings img{width:100px;height:75px;object-fit:contain;cursor:pointer;background:#060a15}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;background:#070b14;padding:12px;max-height:260px;overflow:auto}.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.compare img{width:100%;height:55vh;object-fit:contain}.warn{color:#fbbf24}.small{font-size:12px}.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}@media(max-width:700px){.detail-grid{grid-template-columns:1fr}main,header{padding:16px}}
</style>
<header><div class="topline"><div><h1>Collection explorer</h1><p>Saved frames as they arrive. Filter, inspect a pick, or compare views.</p></div><a href="/">Training & models</a></div><div id="connection" class="warn">Connecting to station…</div><div id="activity" class="activity"></div><p class="small">Activity is read from station processes. Multiple stages may run together. This explorer never commands hardware.</p></header>
<main><div class="tools"><button id="refresh">Refresh now</button><label><input id="live" type="checkbox" checked> Follow new captures · refresh every 4 s</label><button id="compare">Compare selected (0)</button><button id="clear">Clear filters</button><button id="csv">Export filtered CSV</button></div>
<div id="counts" class="counts"></div><div id="warnings" class="warn"></div><div class="filters" id="filters"></div><div id="gallery" class="gallery"></div><p id="pageinfo"></p><button id="more" hidden>Load 80 more</button></main>
<dialog id="detail"><div class="topline"><h2 id="detail-title"></h2><button id="close-detail">Close</button></div><div id="detail-body"></div></dialog>
<dialog id="comparison"><div class="topline"><h2>Compare saved captures</h2><button id="close-compare">Close</button></div><div id="comparison-body" class="compare"></div></dialog>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=[['run','Run'],['part','Part type'],['label','Label'],['pose','Pose'],['background','Background'],['camera','Camera'],['view','View'],['kind','Frame / crop'],['decision','Pick outcome']];
let rows=[],filtered=[],selected=new Set(),limit=80,filters={},openId=null,busy=false;
const image=r=>'/api/explore/image?id='+encodeURIComponent(r.id);
for(const [key,label] of fields){const l=document.createElement('label');l.textContent=label;const s=document.createElement('select');s.id='filter-'+key;s.onchange=()=>{filters[key]=s.value;limit=80;render()};l.append(s);$('filters').append(l)}
const search=document.createElement('label');search.textContent='Search run / item / file';search.innerHTML+='<input id="search" placeholder="item_003, top_2…">';$('filters').append(search);$('search').oninput=()=>{limit=80;render()};
function options(){for(const [key] of fields){const s=$('filter-'+key),value=filters[key]||'';s.innerHTML='<option value="">All</option>'+[...new Set(rows.map(r=>r[key]))].sort().map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');s.value=value;if(s.value!==value)filters[key]=''}}
function render(){const q=$('search').value.toLowerCase();filtered=rows.filter(r=>fields.every(([k])=>!filters[k]||r[k]===filters[k])&&(!q||[r.run,r.item,r.filename,r.part].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.modified-a.modified||b.id.localeCompare(a.id));
$('counts').innerHTML='<strong>'+filtered.length+'</strong> matching images · <strong>'+new Set(filtered.map(r=>r.run+'/'+r.item)).size+'</strong> picks · <strong>'+new Set(filtered.map(r=>r.run)).size+'</strong> runs · '+rows.length+' images indexed';
$('gallery').innerHTML=filtered.slice(0,limit).map(r=>'<article class="card '+(selected.has(r.id)?'selected':'')+'" data-id="'+r.id+'"><img loading="lazy" src="'+image(r)+'" alt="'+esc(r.item+' '+r.filename)+'"><div class="caption"><b>'+esc(r.item)+' · '+esc(r.filename)+'</b><div class="small">'+esc(r.run)+'</div><span class="tag">'+esc(r.part)+'</span><span class="tag">'+esc(r.label)+'</span><span class="tag">'+esc(r.pose)+'</span><div style="margin-top:10px"><button data-select="'+r.id+'">'+(selected.has(r.id)?'Deselect':'Select for compare')+'</button></div></div></article>').join('')||'<div class="empty">No saved images match these filters. New files appear automatically. Missing metadata is shown as unknown.</div>';
$('pageinfo').textContent='Showing '+Math.min(limit,filtered.length)+' of '+filtered.length;$('more').hidden=limit>=filtered.length;$('compare').textContent='Compare selected ('+selected.size+')';}
$('gallery').onclick=e=>{const s=e.target.closest('[data-select]');if(s){const id=s.dataset.select;if(selected.has(id))selected.delete(id);else if(selected.size<4)selected.add(id);else{alert('Select up to four images.');return}render();return}const c=e.target.closest('[data-id]');if(c)inspect(c.dataset.id)};
function inspect(id){openId=id;const r=rows.find(x=>x.id===id);if(!r)return;const siblings=rows.filter(x=>x.run===r.run&&x.item===r.item);$('detail-title').textContent=r.item+' · '+r.filename;$('detail-body').innerHTML='<div class="detail-grid"><div><img id="full" src="'+image(r)+'" alt="'+esc(r.filename)+'"><p id="resolution"></p><div class="siblings">'+siblings.map(x=>'<img data-sibling="'+x.id+'" title="'+esc(x.filename)+'" alt="'+esc(x.filename)+'" src="'+image(x)+'">').join('')+'</div></div><div><b>'+esc(r.run)+'</b><p>'+esc(r.part)+' · '+esc(r.label)+' · '+esc(r.pose)+'</p><p>Background: '+esc(r.background)+'<br>Outcome: '+esc(r.decision)+'</p><p>Saved '+new Date(r.modified*1000).toLocaleString()+'</p><a target="_blank" rel="noopener" href="'+image(r)+'">Open original image</a><h3>Capture metadata</h3><pre>'+esc(JSON.stringify(r.metadata,null,2))+'</pre><h3>Decision record</h3><pre>'+esc(JSON.stringify(r.decision_record,null,2))+'</pre><p class="small">Unknown values are missing from the recorded metadata; they are not inferred from the picture.</p></div></div>';$('full').onload=()=>{$('resolution').textContent=$('full').naturalWidth+' × '+$('full').naturalHeight+' original pixels'};if(!$('detail').open)$('detail').showModal()}
$('detail-body').onclick=e=>{if(e.target.dataset.sibling)inspect(e.target.dataset.sibling)};$('close-detail').onclick=()=>{$('detail').close();openId=null};
$('compare').onclick=()=>{const a=rows.filter(r=>selected.has(r.id));if(!a.length)return;$('comparison-body').innerHTML=a.map(r=>'<div><b>'+esc(r.item+' · '+r.filename)+'</b><p>'+esc(r.run)+'</p><img src="'+image(r)+'" alt="'+esc(r.filename)+'"><p>'+esc(r.part+' · '+r.label+' · '+r.pose)+'</p></div>').join('');$('comparison').showModal()};$('close-compare').onclick=()=>$('comparison').close();
async function load(){if(busy)return;busy=true;try{const response=await fetch('/api/explore',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const s=await response.json();rows=s.records;options();render();const a=s.activity;const names={collection:'Collecting',training:'Training',evaluation:'Evaluating',sorting:'Sorting',replay:'Replaying'};const any=Object.values(a.states).some(v=>v.length);$('activity').innerHTML=Object.entries(names).map(([k,n])=>'<span class="state '+(a.states[k].length?'on':a.known?'':'unknown')+'">'+n+': '+(a.states[k].length?'active · '+a.states[k].length+' process(es)':a.known?'inactive':'unknown')+'</span>').join('')+'<span class="state">'+(any?'System in use':a.known?'Idle':'Activity unknown')+'</span>';$('connection').className='';$('connection').textContent='Connected to '+s.host+' · checked '+new Date(s.checked*1000).toLocaleTimeString();$('warnings').textContent=s.warnings.join(' ')}catch(e){$('connection').className='warn';$('connection').textContent='Disconnected — displaying last received data; activity unknown.';$('activity').innerHTML='<span class="state unknown">Activity unknown · server unreachable</span>'}finally{busy=false}}
$('refresh').onclick=load;$('more').onclick=()=>{limit+=80;render()};$('clear').onclick=()=>{filters={};$('search').value='';options();limit=80;render()};
$('csv').onclick=()=>{const keys=['run','item','filename','part','label','pose','background','camera','view','decision'];const quote=v=>'"'+String(v).replace(/"/g,'""')+'"';const csv=[keys.map(quote).join(','),...filtered.map(r=>keys.map(k=>quote(r[k])).join(','))].join('\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='collection-selection.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
load();setInterval(()=>{if($('live').checked)load()},4000);
</script></html>
