<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ops Console</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--line:#2a2f3a;--ink:#e6e8ec;--dim:#8b93a3;--good:#3fb96f;--bad:#e5484d;--warn:#f5a524;--acc:#4c8dff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0 12px 0 0}.badge{padding:4px 10px;border-radius:6px;font-weight:700}
.run{background:var(--good);color:#000}.idle{background:#333a46}.err{background:var(--bad)}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px;padding:12px 16px}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:0 0 8px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.35 Consolas,monospace;max-height:260px;overflow:auto}
button,select{font:inherit;color:var(--ink);background:#262b36;border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}
#stop{background:var(--bad);border:0;color:#fff;font-weight:800;font-size:18px;padding:12px 28px;margin-left:auto}
#arm{background:var(--warn);color:#000;border:0;font-weight:700}#confirm{background:var(--good);color:#000;border:0;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
#banner{display:none;margin:12px 16px 0;padding:12px 16px;border-radius:8px;background:var(--warn);color:#000;font-weight:700;font-size:16px}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;vertical-align:top}
.reject{color:var(--bad);font-weight:700}.good{color:var(--good);font-weight:700}
.snaps{display:grid;grid-template-columns:1fr 1fr;gap:8px}.snaps img{width:100%;background:#000;border-radius:4px;min-height:120px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.dim{color:var(--dim);font-size:12px}
code{font:12px Consolas,monospace;color:var(--dim)}
@media (max-width:480px){main{grid-template-columns:1fr;padding:12px}header{padding:10px 12px}}
</style></head><body>
<header>
  <h1>Ops Console</h1>
  <span id="runbadge" class="badge idle">…</span>
  <span id="host" class="dim"></span>
  <button id="stop" title="station_run.py stop">STOP</button>
</header>
<div id="banner"></div>
<main>
  <section>
    <h2>Start (two steps)</h2>
    <div class="row"><select id="preset"></select></div>
    <div class="row">
      <button id="arm">1 · ARM</button>
      <label><input type="checkbox" id="estop"> Person at the E-stop</label>
      <button id="confirm" disabled>2 · CONFIRM START</button>
    </div>
    <div class="dim">Confirm within 5 s of arming. Runs: <code id="cmd"></code></div>
    <h2 style="margin-top:12px">Last action</h2><pre id="job">none</pre>
  </section>
  <section><h2>Station log <span id="logage" class="dim"></span></h2><pre id="log"></pre></section>
  <section><h2>Decisions <span id="run" class="dim"></span></h2><div id="counts" class="dim"></div>
    <table id="dec"><thead><tr><th>#</th><th>seen</th><th>decision</th><th>view</th><th>latency</th><th>cycle</th><th>reason</th></tr></thead><tbody></tbody></table></section>
  <section><h2>Cameras</h2><div class="row"><button id="snap">Snapshot</button><label><input type="checkbox" id="live"> refresh every 3 s</label></div>
    <div class="snaps"><figure style="margin:0"><img id="img-overview-cam" alt="overview-cam"><figcaption class="dim">overview-cam (webcam)</figcaption></figure>
    <figure style="margin:0"><img id="img-cam" alt="cam"><figcaption class="dim">cam (wrist, color)</figcaption></figure></div></section>
  <section><h2>Health</h2><pre id="health"></pre></section>
  <section><h2>Device bench <span id="benchwhen" class="dim"></span></h2>
    <table id="bench"><thead><tr><th>model</th><th>device</th><th>p50 ms</th><th>p90 ms</th><th>compile ms</th></tr></thead><tbody></tbody></table></section>
</main>
<script>
const $=id=>document.getElementById(id);let S=null;
const get=async p=>{const r=await fetch(p,{cache:'no-store'});let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,j}};
const age=t=>t?Math.round(Date.now()/1000-t)+' s ago':'';
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function render(){
  if(!S)return;const c=S.cache||{};
  const st=c.status||{};const d=st.data;
  $('runbadge').className='badge '+(st.error?'err':d&&d.running?'run':'idle');
  $('runbadge').textContent=st.error?'STATION UNREACHABLE':d?(d.running?'sort.py RUNNING':'NOT RUNNING'):'…';
  $('log').textContent=st.error||(d&&d.log)||'';$('logage').textContent=age(st.t);
  const h=c.health||{};$('health').textContent=h.error||Object.entries(h.data||{}).map(([k,v])=>k+': '+v).join('\n');
  $('host').textContent=h.data?h.data.host:'';
  const dc=c.decisions||{};const dd=dc.data;
  if(dd){$('run').textContent=dd.run+' · '+age(dc.t);
    $('counts').textContent=dd.count+' decisions: '+Object.entries(dd.counts).map(([k,v])=>k+' '+v).join(', ')+(dd.latency_p50_ms!=null?' · latency p50 '+dd.latency_p50_ms+' ms':'');
    $('dec').tBodies[0].innerHTML=dd.rows.slice().reverse().map(r=>`<tr><td>${r.item}</td><td>${esc(r.t_seen)}</td><td class="${esc(r.decision)}">${esc(r.decision)}</td><td>${esc(r.view)}</td><td>${r.latency_ms??''}</td><td>${r.cycle_s??''}</td><td>${esc(r.reason)}</td></tr>`).join('');}
  else if(dc.error){$('counts').textContent=dc.error}
  const b=c.bench||{};if(b.data){$('benchwhen').textContent='measured '+b.data.measured;
    $('bench').tBodies[0].innerHTML=b.data.rows.map(r=>`<tr><td>${esc(r.model.replace('models/','').replace('/model.xml',''))}</td><td>${esc(r.device)}</td><td>${r.p50_ms??(r.ok===false?'failed':'')}</td><td>${r.p90_ms??''}</td><td>${r.compile_ms??''}</td></tr>`).join('');}
  const a=S.armed;const ban=$('banner');
  if(a){ban.style.display='block';ban.textContent=`ARMED: ${S.presets[a.preset].title}. Person at the E-stop? Press CONFIRM within ${a.left_s} s.`}
  else ban.style.display='none';
  $('confirm').disabled=!(a&&$('estop').checked);
  const j=S.job;$('job').textContent=j?`${j.kind}${j.preset?' '+j.preset:''} · ${j.ended?'done rc='+j.rc:'running…'} · ${age(j.started)}\n${j.output||''}`:'none';
}
async function poll(){try{const r=await get('/api/state');S=r.j;render()}catch(e){$('runbadge').className='badge err';$('runbadge').textContent='CONSOLE DOWN'}}
async function init(){await poll();for(const [k,v] of Object.entries(S.presets)){const o=document.createElement('option');o.value=k;o.textContent=v.title;$('preset').append(o)}
  const showCmd=()=>$('cmd').textContent=S.presets[$('preset').value].command.join(' ');$('preset').onchange=showCmd;showCmd();
  setInterval(poll,500)}
$('stop').onclick=async()=>{await get('/api/stop');poll()};
$('arm').onclick=async()=>{const r=await get('/api/arm?preset='+$('preset').value);if(!r.ok)alert(r.j.error);poll()};
$('estop').onchange=render;
$('confirm').onclick=async()=>{if(!$('estop').checked)return;const r=await get('/api/confirm?preset='+$('preset').value);if(!r.ok)alert(r.j.error);$('estop').checked=false;poll()};
function snap(){for(const c of ['overview-cam','cam']){$('img-'+c).src='/api/snapshot?cam='+c+'&t='+Date.now()}}
$('snap').onclick=snap;setInterval(()=>{if($('live').checked)snap()},3000);
init();snap();
</script></body></html>
